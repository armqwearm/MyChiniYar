name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate release secrets
        env:
          KEYSTORE_B64: ${{ secrets.CHINIYAR_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.CHINIYAR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CHINIYAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CHINIYAR_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "Missing CHINIYAR_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing CHINIYAR_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing CHINIYAR_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing CHINIYAR_KEY_PASSWORD"; exit 1; }
          echo "All four release signing secrets are configured."

      - name: Validate tag matches app version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          test -n "$app_version" || { echo "Could not read versionName"; exit 1; }
          test "$tag_version" = "$app_version" || {
            echo "Tag version $tag_version does not match app version $app_version"
            exit 1
          }

      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Decode Android signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.CHINIYAR_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/chiniyar-release.jks"
          chmod 600 "$RUNNER_TEMP/chiniyar-release.jks"
          test -s "$RUNNER_TEMP/chiniyar-release.jks"

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.CHINIYAR_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.CHINIYAR_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.CHINIYAR_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" sign             --ks "$RUNNER_TEMP/chiniyar-release.jks"             --ks-key-alias "$KEY_ALIAS"             --ks-pass "env:KEYSTORE_PASSWORD"             --key-pass "env:KEY_PASSWORD"             --out app/build/outputs/apk/release/app-release.apk             app/build/outputs/apk/release/app-release-unsigned.apk
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/release/app-release.apk | tee app-release.sha256

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME"             app/build/outputs/apk/release/app-release.apk             app-release.sha256             --title "MyChiniYar $GITHUB_REF_NAME"             --generate-notes
