name: Android CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'release/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Build optimized signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release APK signature
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chiniyar-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload installable release APK
        uses: actions/upload-artifact@v4
        with:
          name: chiniyar-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/release/1.0.0' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: MyChiniYar v1.0.0
          generate_release_notes: true
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
